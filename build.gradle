buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

configurations {
    deployJars
}

import static net.minecraftforge.gradle.dev.ForgeDevPlugin.*

apply plugin: 'maven'
apply plugin: 'forgedev'

repositories {
    mavenLocal()
    flatDir {
        name "fileRepo"
        dirs "repo"
    }
}

minecraft {
    version = '1.7.10'
    mcpVersion = '9.05'
    fmlDir = projectDir.getAbsolutePath() + "/fml";
    mainClass = 'cpw.mods.fml.relauncher.ServerLaunchWrapper'
    tweakClass = 'cpw.mods.fml.common.launcher.FMLTweaker'
    installerVersion = "1.7.7"
}

group = 'net.minecraftforge'
version = getVersionFromJava(getProject(), 'src/main/java/net/minecraftforge/common/ForgeVersion.java')

jenkins {
    job = 'minecraftforge'
}

// crowdin stuff
if (project.hasProperty("crowdinKey"))
    tasks.getLocalizations.apiKey = project.crowdinKey


launch4j {
    jreMinVersion = '1.6.0'
}

def extraRepositories = '''

repositories
{
    maven { url 'https://nexus.gtnewhorizons.com/repository/releases/' }
    maven { url 'https://jitpack.io/' }
}

configurations.all { exclude group: 'org.lwjgl.lwjgl' }
'''

def lwjglNatives = '''

dependencies
{
    ['lwjgl', 'lwjgl-opengl', 'lwjgl-openal', 'lwjgl-sdl'].each { module ->
        ['natives-macos-arm64', 'natives-macos', 'natives-linux-arm64', 'natives-linux', 'natives-windows-arm64', 'natives-windows'].each { natives ->
            runtime("org.lwjgl:${module}:3.4.3:${natives}") { transitive = false }
        }
    }
}
'''

def runTasks = '''

def javaModuleArgs = ['-XX:+IgnoreUnrecognizedVMOptions', '--add-opens=java.base/java.net=ALL-UNNAMED']

task runClient(type: JavaExec, dependsOn: 'classes') {
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.gtnewhorizons.retrofuturabootstrap.Main'
    workingDir = file('../run')
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader',
        '-Xmx1024M', '-Xms1024M', "-Djava.library.path=${file('../run/bin/natives')}"
    jvmArgs javaModuleArgs
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        main = 'com.koyomiji.dualwjgl.Launcher'
        jvmArgs '-XstartOnFirstThread', '-Dcom.koyomiji.dualwjgl.main=com.gtnewhorizons.retrofuturabootstrap.Main'
    }
    args '--version', '1.7.10', '--tweakClass', 'cpw.mods.fml.common.launcher.FMLTweaker',
        '--assetIndex', '1.7.10', '--assetsDir', "${gradle.gradleUserHomeDir}/caches/minecraft/assets",
        '--accessToken', 'Forge', '--userProperties', '{}', '--username', 'Dev'
    if (project.hasProperty('runJavaHome'))
        executable = new File(project.runJavaHome, 'bin/java').path
}

task runServer(type: JavaExec, dependsOn: 'classes') {
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.gtnewhorizons.retrofuturabootstrap.Main'
    workingDir = file('../run')
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader'
    jvmArgs javaModuleArgs
    args '--tweakClass', 'cpw.mods.fml.common.launcher.FMLServerTweaker'
    if (project.hasProperty('runJavaHome'))
        executable = new File(project.runJavaHome, 'bin/java').path
}
'''

tasks.generateProjectClean.doLast {
    file('eclipse/Clean/build.gradle') << extraRepositories
}
tasks.generateProjectForge.doLast {
    file('eclipse/Forge/build.gradle') << extraRepositories + lwjglNatives + runTasks
}

uploadArchives {
    repositories {
        add getProject().repositories.mavenLocal()
    }
    repositories.mavenDeployer {
        configuration = configurations.deployJars

        if (project.hasProperty("filesmaven")) {
            logger.info('Publishing to files server')
            repository(url: project.filesmaven.url) {
                authentication(userName: project.filesmaven.username, privateKey: project.filesmaven.key)
            }
        } else {
            logger.info('Publishing to repo folder')
            repository(url: 'file://localhost/' + project.file('repo').getAbsolutePath())
        }

        pom {
            groupId = project.group
            version = project.version
            artifactId = project.archivesBaseName
        }
        pom.project {
            name project.archivesBaseName
            packaging 'jar'
            description 'Minecraft Forge API'
            url 'https://github.com/MinecraftForge/MinecraftForge'

            scm {
                url 'https://github.com/MinecraftForge/MinecraftForge'
                connection 'scm:git:git://github.com/MinecraftForge/MinecraftForge.git'
                developerConnection 'scm:git:git@github.com:MinecraftForge/MinecraftForge.git'
            }

            issueManagement {
                system 'github'
                url 'https://github.com/MinecraftForge/MinecraftForge/issues'
            }

            licenses {
                license {
                    name 'Forge Public License'
                    url 'https://raw.github.com/MinecraftForge/MinecraftForge/master/MinecraftForge-License.txt'
                    distribution 'repo'
                }
            }

            developers {
                developer {
                    id 'cpw'
                    name 'cpw'
                    roles { role 'developer' }
                }
                developer {
                    id 'LexManos'
                    name 'Lex Manos'
                    roles { role 'developer' }
                }
                developer {
                    id 'AbrarSyed'
                    name 'Abrar Syed'
                    roles { role 'contributor' }
                }
            }
        }
    }
}
