buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

configurations {
    deployJars
}

import static net.minecraftforge.gradle.dev.ForgeDevPlugin.*

apply plugin: 'maven'
apply plugin: 'forgedev'

repositories {
    mavenLocal()
    flatDir {
        name "fileRepo"
        dirs "repo"
    }
}

minecraft {
    version = '1.7.10'
    mcpVersion = '9.05'
    fmlDir = projectDir.getAbsolutePath() + "/fml";
    mainClass = 'cpw.mods.fml.relauncher.ServerLaunchWrapper'
    tweakClass = 'cpw.mods.fml.common.launcher.FMLTweaker'
    installerVersion = "1.7.7"
}

group = 'com.koyomiji.anneal'
version = getVersionFromJava(getProject(), 'src/main/java/net/minecraftforge/common/ForgeVersion.java')

def annealVersion = {
    def describe = ['git', 'describe', '--tags', '--dirty', '--match', 'anneal/[0-9]*'].execute(null, projectDir)
    def described = describe.text.trim()
    if (describe.waitFor() == 0)
        return described - 'anneal/'
    return '0.0.0-g' + ['git', 'describe', '--always', '--dirty', '--exclude', '*'].execute(null, projectDir).text.trim()
}()
def annealArtifact = "com.koyomiji.anneal:anneal:${minecraft.version}-${annealVersion}".toString()

// crowdin stuff
if (project.hasProperty("crowdinKey"))
    tasks.getLocalizations.apiKey = project.crowdinKey


def patchClasses = [
    'com/koyomiji/anneal/FinalFieldHelper',
    'cpw/mods/fml/common/registry/ObjectHolderRef',
    'cpw/mods/fml/common/registry/ItemStackHolderRef',
    'net/minecraftforge/common/util/EnumHelper',
    'cpw/mods/fml/common/launcher/FMLTweaker',
    'cpw/mods/fml/common/discovery/JarDiscoverer',
    'cpw/mods/fml/common/discovery/DirectoryDiscoverer',
    'cpw/mods/fml/common/patcher/ClassPatchManager',
    'cpw/mods/fml/common/asm/transformers/EventSubscriptionTransformer',
]

def serverClassPath = {
    def json = new groovy.json.JsonSlurper().parse(file("fml/jsons/${minecraft.version}-rel.json"))
    def paths = json.versionInfo.libraries.findAll { it.serverreq }.collect { lib ->
        def (coords, ext) = lib.name.contains('@') ? lib.name.split('@') as List : [lib.name, 'jar']
        def (group, name, version, classifier) = coords.tokenize(':') + [null]
        "libraries/${group.replace('.', '/')}/${name}/${version}/${name}-${version}${classifier ? '-' + classifier : ''}.${ext}"
    }
    (paths + "minecraft_server.${minecraft.version}.jar").join(' ')
}

task packagePatches(type: Jar, dependsOn: 'packageUniversal') {
    baseName = 'anneal'
    version = "${minecraft.version}-${annealVersion}"
    from({ zipTree(tasks.packageUniversal.archivePath) }) {
        patchClasses.each { name -> include "${name}.class", "${name}\$*.class" }
    }
    manifest {
        attributes 'Main-Class': minecraft.mainClass, 'TweakClass': minecraft.tweakClass, 'Class-Path': serverClassPath()
    }
}

tasks.generateInstallJson.addReplacement('@patches_jar@', { tasks.packagePatches.archiveName })
tasks.generateInstallJson.addReplacement('@anneal_artifact@', annealArtifact)
tasks.generateInstallJson.addReplacement('@anneal_version@', annealVersion)
tasks.packageInstaller {
    baseName = 'anneal'
    version = "${minecraft.version}-${annealVersion}"
    dependsOn packagePatches
    exclude { it.file == tasks.packageUniversal.archivePath }
    exclude '*-changelog.txt', 'Paulscode*'
    from { tasks.packagePatches.archivePath }
}

def extraRepositories = '''

repositories
{
    maven { url 'https://nexus.gtnewhorizons.com/repository/releases/' }
    maven { url 'https://jitpack.io/' }
}

configurations.all { exclude group: 'org.lwjgl.lwjgl' }
'''

def lwjglNatives = '''

dependencies
{
    ['lwjgl', 'lwjgl-opengl', 'lwjgl-openal', 'lwjgl-sdl'].each { module ->
        ['natives-macos-arm64', 'natives-macos', 'natives-linux-arm64', 'natives-linux', 'natives-windows-arm64', 'natives-windows'].each { natives ->
            runtime("org.lwjgl:${module}:3.4.3:${natives}") { transitive = false }
        }
    }
}
'''

def runTasks = '''

def javaModuleArgs = ['-XX:+IgnoreUnrecognizedVMOptions', '--add-opens=java.base/java.net=ALL-UNNAMED']

task runClient(type: JavaExec, dependsOn: 'classes') {
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.gtnewhorizons.retrofuturabootstrap.Main'
    workingDir = file('../run')
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader',
        '-Xmx1024M', '-Xms1024M', "-Djava.library.path=${file('../run/bin/natives')}"
    jvmArgs javaModuleArgs
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        main = 'com.koyomiji.dualwjgl.Launcher'
        jvmArgs '-XstartOnFirstThread', '-Dcom.koyomiji.dualwjgl.main=com.gtnewhorizons.retrofuturabootstrap.Main'
    }
    args '--version', '1.7.10', '--tweakClass', 'cpw.mods.fml.common.launcher.FMLTweaker',
        '--assetIndex', '1.7.10', '--assetsDir', "${gradle.gradleUserHomeDir}/caches/minecraft/assets",
        '--accessToken', 'Forge', '--userProperties', '{}', '--username', 'Dev'
    if (project.hasProperty('runJavaHome'))
        executable = new File(project.runJavaHome, 'bin/java').path
}

task runServer(type: JavaExec, dependsOn: 'classes') {
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.gtnewhorizons.retrofuturabootstrap.Main'
    workingDir = file('../run')
    jvmArgs '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader'
    jvmArgs javaModuleArgs
    args '--tweakClass', 'cpw.mods.fml.common.launcher.FMLServerTweaker'
    if (project.hasProperty('runJavaHome'))
        executable = new File(project.runJavaHome, 'bin/java').path
}
'''

tasks.generateProjectClean.doLast {
    file('eclipse/Clean/build.gradle') << extraRepositories
}
tasks.generateProjectForge.doLast {
    file('eclipse/Forge/build.gradle') << extraRepositories + lwjglNatives + runTasks
}

uploadArchives {
    repositories {
        add getProject().repositories.mavenLocal()
    }
    repositories.mavenDeployer {
        configuration = configurations.deployJars

        if (project.hasProperty("filesmaven")) {
            logger.info('Publishing to files server')
            repository(url: project.filesmaven.url) {
                authentication(userName: project.filesmaven.username, privateKey: project.filesmaven.key)
            }
        } else {
            logger.info('Publishing to repo folder')
            repository(url: 'file://localhost/' + project.file('repo').getAbsolutePath())
        }

        pom {
            groupId = project.group
            version = project.version
            artifactId = project.archivesBaseName
        }
        pom.project {
            name 'Anneal'
            packaging 'jar'
            description 'Minecraft Forge 1.7.10 on modern Java'
            url 'https://github.com/k0michi/MinecraftForge'

            scm {
                url 'https://github.com/k0michi/MinecraftForge'
                connection 'scm:git:git://github.com/k0michi/MinecraftForge.git'
                developerConnection 'scm:git:git@github.com:k0michi/MinecraftForge.git'
            }

            issueManagement {
                system 'github'
                url 'https://github.com/k0michi/MinecraftForge/issues'
            }

            licenses {
                license {
                    name 'Forge Public License'
                    url 'https://raw.github.com/MinecraftForge/MinecraftForge/master/MinecraftForge-License.txt'
                    distribution 'repo'
                }
            }

            developers {
                developer {
                    id 'k0michi'
                    name 'k0michi'
                    roles { role 'developer' }
                }
                developer {
                    id 'cpw'
                    name 'cpw'
                    roles { role 'developer' }
                }
                developer {
                    id 'LexManos'
                    name 'Lex Manos'
                    roles { role 'developer' }
                }
                developer {
                    id 'AbrarSyed'
                    name 'Abrar Syed'
                    roles { role 'contributor' }
                }
            }
        }
    }
}
